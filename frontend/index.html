<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>GINI – AI Genie for your work</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:#f8fafc;font-family:'Poppins',system-ui,sans-serif;background:#070b1a;overflow-x:hidden}
#root{position:relative;z-index:1}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;pointer-events:none;animation:float 16s ease-in-out infinite}
.o1{width:480px;height:480px;background:#7c3aed;top:-120px;left:-100px}
.o2{width:420px;height:420px;background:#06b6d4;top:25%;right:-120px;animation-delay:-5s}
.o3{width:460px;height:460px;background:#ec4899;bottom:-160px;left:25%;animation-delay:-9s;opacity:.4}
.o4{width:300px;height:300px;background:#f59e0b;bottom:15%;right:20%;animation-delay:-3s;opacity:.25}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-50px) scale(1.1)}66%{transform:translate(-30px,40px) scale(.95)}}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
 border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.28);border-radius:1.25rem}
.glass-input{background:rgba(8,12,30,.45);border:1px solid rgba(255,255,255,.18);border-radius:.8rem;color:#fff;outline:none;transition:.2s}
.glass-input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.25)}
input::placeholder,textarea::placeholder{color:rgba(226,232,240,.5)}
.glass-btn{background:linear-gradient(135deg,#06b6d4,#8b5cf6 55%,#ec4899);border:1px solid rgba(255,255,255,.3);border-radius:.8rem;color:#fff;font-weight:600;cursor:pointer;transition:.25s;box-shadow:0 6px 24px rgba(139,92,246,.45)}
.glass-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 30px rgba(236,72,153,.5);filter:brightness(1.1)}.glass-btn:disabled{cursor:not-allowed;opacity:.6}
select,input[type=file]{background:rgba(8,12,30,.5);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:.6rem;padding:.3rem .6rem}
select option{color:#111;background:#fff}
input[type=file]::file-selector-button{background:linear-gradient(135deg,#06b6d4,#8b5cf6);color:#fff;border:0;border-radius:.5rem;padding:.3rem .9rem;margin-right:.8rem;cursor:pointer}
button{cursor:pointer}a{color:#67e8f9}
.brand{background:linear-gradient(90deg,#fde68a,#f9a8d4,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:.04em}
.tool-card{transition:.3s;position:relative;overflow:hidden}
.tool-card:hover{transform:translateY(-6px);border-color:rgba(103,232,249,.6);box-shadow:0 18px 50px rgba(34,211,238,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.tool-icon{width:3rem;height:3rem;display:grid;place-items:center;font-size:1.6rem;border-radius:1rem;background:linear-gradient(135deg,rgba(6,182,212,.35),rgba(236,72,153,.35));border:1px solid rgba(255,255,255,.25)}
.gem{background:linear-gradient(135deg,rgba(251,191,36,.35),rgba(245,158,11,.15));border:1px solid rgba(251,191,36,.5);color:#fde68a}
.toast{animation:slide .3s ease;border-left:5px solid #38bdf8}.toast-success{border-left-color:#4ade80}.toast-error{border-left-color:#f87171}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.lamp-float{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:8px}
</style></head><body><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
